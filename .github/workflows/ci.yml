name: ci

# Tests only. Releases are tag-driven (release.yml); nothing here publishes.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - '.specify/**'
      - '.claude/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - '.specify/**'
      - '.claude/**'
      - 'LICENSE'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Dnui.slnx -c Debug
      - name: Pack runtime for this runner (local feed for acquisition tests)
        run: dotnet build Dnui.Runtime -t:PackRuntime -p:RuntimeIdentifier=${{ matrix.rid }}
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test Dnui.slnx -c Debug --no-build
      - name: Test (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet test Dnui.slnx -c Debug --no-build
