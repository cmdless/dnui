name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Dnui.slnx -c Debug
      - name: Pack runtime for this runner (local feed for acquisition tests)
        run: dotnet build Dnui.Runtime -t:PackRuntime -p:RuntimeIdentifier=${{ matrix.rid }}
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test Dnui.slnx -c Debug --no-build
      - name: Test (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet test Dnui.slnx -c Debug --no-build

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack runtime packages for every RID
        run: |
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64; do
            dotnet build Dnui.Runtime -t:PackRuntime -p:RuntimeIdentifier=$rid
          done
      - name: Pack library
        run: dotnet pack Dnui/Dnui.csproj -c Release -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
